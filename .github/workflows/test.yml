name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Test configuration logic (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\Test-Core.ps1
      - name: Test WPF interface (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\Test-Ui.ps1
      - name: Test configuration logic (PowerShell 7)
        shell: pwsh
        run: .\tests\Test-Core.ps1
      - name: Test WPF interface (PowerShell 7)
        shell: pwsh
        run: .\tests\Test-Ui.ps1
